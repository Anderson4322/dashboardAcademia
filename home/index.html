<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia de alunos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <header>
            <h1>CRUD</h1>
            <div id="headerMove">

                <h2></h2>
                <button id="disconnect">disconnect</button>
            </div>
            <!-- <input type="color" name="cor" id="inputcolor">
            <div id="cardcolor"></div> -->
        </header>

        <button id="open">Adress </button>
        <dialog id="modal">

            <form>
                <div id="closeMove">

                    <button type="button" id="close">X</button>
                </div>
                <label for="nome">Nome do produto: </label>
                <input type="text" id="nome_prod" name="nome_prod" placeholder="Digite o nome do produto" maxlength="50"
                    required>
                <label for="codigo">Codigo:</label>
                <input type="number" name="codigo" id="codigo" placeholder="Digite o codigo do produto" required>
                <label for="preco">Preço:</label>
                <input type="number" name="preco" id="preco" placeholder="Digite o preço" maxlength="2" required>
                <label for="quantidade">Quantidade:</label>
                <input type="text" name="quantidade" id="quantidade" placeholder="Digite a Quantidade do produto"
                    required>
                <label for="cor">Cor:</label>
                <input type="text" id="cor" name="cor" placeholder="Digite a cor do produto" required>
                <label for="capac">Capacidade:</label>
                <input type="text" id="capac" name="capac" placeholder="Digite o numero de capacidade" required>
                <label for="capac">Espec:</label>
                <input type="text" id="espec" name="espec" placeholder="Digite a espec">
                <label for="quantidade_min">quantidade_min</label>
                <input type="number" id="quantidade_min" name="quantidade_min" placeholder="Digite a quantidade_min">
                <label for="id_fabric">Fabricante:</label>
                <select name="id_fabric" id="id_fabric">
                </select>
                <button id="btn-confirmar" type="submit">Confirmar</button>
            </form>
        </dialog>
        <div id="text-information">
            <p id="nProdutos"></p>
        </div>
        <div id="moveTable">


            <table>
                <thead>
                    <tr>
                        <th>id_produto</th>
                        <th>id_fabricante</th>
                        <th>Produto</th>
                        <th>Codigo</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Cor</th>
                        <th>armazenamento</th>
                        <th>Especificações</th>
                        <th>Quantidade minima</th>
                    </tr>
                </thead>
                <tbody>


                </tbody>
            </table>
        </div>

    </div>

    <dialog id="modalLogin">

        <div class="icone">🔒</div>

        <h2>Acesso necessário</h2>

        <p>
            Faça login ou crie uma conta para acessar esta funcionalidade.
        </p>

        <div class="acoes">
            <button class="login">Fazer Login</button>
            <button class="cadastro">Cadastrar-se</button>
        </div>

    </dialog>
    <script src="./script.js"></script>
</body>

</html>
