<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia de alunos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <header>
            <h1 id="Titulo">PowerGym</h1>
            <div id="headerMove">

                <h2></h2>
                <button id="disconnect">disconnect</button>
            </div>
            <!-- <input type="color" name="cor" id="inputcolor">
            <div id="cardcolor"></div> -->
        </header>

        <div id="moveAdress">

            <button id="open">+</button>
        </div>
        <dialog id="modal">

            <form>
                <div id="closeMove">

                    <button type="button" id="close">X</button>
                </div>
                <label for="Treino">Treino:</label>
                <input type="text" name="Treino" placeholder="Treino" id="treino">
                <label for="Exercicios">Exercicios:</label>
                <input type="text" name="Exercicios" placeholder="Exercicios" id="exercicios">
                <label for="Duração">Duração:</label>
                <input type="text" name="Duração" placeholder="Duração" id="duracao">
                <label for="Repetição">Repetição:</label>
                <input type="text" name="Repetição" placeholder="Repetição" id="repeticao">
                <label for="usuario">Usuarios:</label>
                <select name="usuario" id="id_usuario">
                </select>
                <button id="btn-confirmar" type="submit">Confirmar</button>
            </form>
        </dialog>
        <div id="text-information">
            <p id="nProdutos"></p>
        </div>
        <div id="moveTable">


            <table>
                <thead>
                    <tr>
                        <th>id_treino</th>
                        <th>Nome de usuario</th>
                        <th>Treino</th>
                        <th>Duração</th>
                        <th>Repetição</th>
                        <th>Exercicios</th>
                        <th>Professor</th>
                    </tr>
                </thead>
                <tbody>


                </tbody>
            </table>

        </div>

    </div>


    <dialog id="DetalhesModal">



       <button id="closeDetalhes" aria-label="Fechar modal">
        X
    </button>

    <div id="Detalhes">

        <div class="modal-header">
            <h1 id="Nome_aluno"></h1>
        </div>

        <div class="detalhes-grid">

            <div class="detalhe-item">
                <span class="icone">⚖ </span>
                <div>
                    <small>PESO</small>
                    <p id="Detalhes_peso"></p>
                </div>
            </div>

            <div class="detalhe-item">
                <span class="icone">↕</span>
                <div>
                    <small>ALTURA</small>
                    <p id="Detalhes_altura"></p>
                </div>
            </div>

            <div class="detalhe-item">
                <span class="icone">◷</span>
                <div>
                    <small>IDADE</small>
                    <p id="Detalhes_idade"></p>
                </div>
            </div>

        </div>

    </div>

    </dialog>
    <script src="./script.js"></script>
</body>

</html>
